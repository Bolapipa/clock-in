name: Pipeline diário dados.gov.br

# Ingere o catálogo do dados.gov.br e os testes de links na Bronze e monta a Silver.
# Cada passo é uma etapa própria, com seu log e seu tempo na aba Actions.
# Por enquanto só roda quando disparado à mão (aba Actions > Pipeline diário dados.gov.br > Run workflow).
# Depois de conferir algumas execuções, remova o "#" das duas linhas do schedule para rodar
# todo dia às 03:00 de Brasília (06:00 UTC).
on:
  workflow_dispatch:
    inputs:
      data:
        description: "Data da execução (AAAA-MM-DD). Vazio = hoje em Brasília"
        required: false
        default: ""
      desde:
        description: "Passo em que o pipeline começa (para retomar uma execução)"
        type: choice
        default: lista
        options: [lista, painel, detalhe, silver, links, silver_links]
  # schedule:
  #   - cron: "0 6 * * *"

# Preciso criar e atualizar releases (estado e histórico)
permissions:
  contents: write

# Nunca duas execuções ao mesmo tempo: as duas mexeriam no mesmo estado
concurrency:
  group: pipeline-diario
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Limite do GitHub: 6 horas por job
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
      # Login do gh nos comandos de release
      GH_TOKEN: ${{ github.token }}
      # Chave da API do dados.gov.br, guardada como secret do repositório
      CHAVE_API_DADOS_GOV: ${{ secrets.CHAVE_API_DADOS_GOV }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Preparação | Instala as dependências
        run: pip install -r requirements.txt

      - name: Preparação | Define a data e o início da execução
        env:
          DATA_INFORMADA: ${{ inputs.data }}
          DESDE_INFORMADO: ${{ inputs.desde || 'lista' }}
        run: |
          if [ -n "$DATA_INFORMADA" ]; then
            DATA="$DATA_INFORMADA"
          else
            DATA=$(python -c "import sys; sys.path.insert(0, 'coletor'); import portal; print(portal.data_de_hoje())")
          fi
          # Confere o formato antes de usar a data em qualquer comando
          python -c "import sys, datetime; datetime.date.fromisoformat(sys.argv[1])" "$DATA"
          echo "Data da execução: $DATA"
          # Variáveis lidas pelas etapas seguintes: a data, o passo inicial (para retomar) e o início
          # da execução em segundos, de onde o motor conta o orçamento de tempo do teste de links
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          echo "DESDE=$DESDE_INFORMADO" >> "$GITHUB_ENV"
          echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - name: Estado | Baixa o estado de ontem
        id: baixar
        run: python coletor/nuvem.py baixar

      # Cada etapa abaixo chama o motor para um passo só. Se o passo vem antes do "desde"
      # escolhido, o motor não faz nada, e é assim que uma execução é retomada.
      - name: Bronze | Ingestão da listagem do catálogo
        run: python coletor/motor.py --data "$DATA" --desde "$DESDE" --apenas lista

      - name: Bronze | Ingestão do cronograma do painel da CGU (opcional)
        run: python coletor/motor.py --data "$DATA" --desde "$DESDE" --apenas painel

      - name: Bronze | Ingestão do detalhe das bases
        run: python coletor/motor.py --data "$DATA" --desde "$DESDE" --apenas detalhe

      - name: Silver | Transformação de bases, recursos e publicadores
        run: python coletor/motor.py --data "$DATA" --desde "$DESDE" --apenas silver

      # Único passo com limite de tempo: para a tempo de sobrar uma reserva para a etapa seguinte
      - name: Bronze | Ingestão dos testes de saúde dos links
        run: python coletor/motor.py --data "$DATA" --desde "$DESDE" --apenas links --tempo-maximo 330 --inicio "$INICIO"

      - name: Silver | Transformação da saúde dos links e das bases
        run: python coletor/motor.py --data "$DATA" --desde "$DESDE" --apenas silver_links

      # As duas etapas abaixo rodam mesmo se uma etapa do pipeline falhar: o que já foi ingerido
      # não se perde, e o dia seguinte continua de onde parou
      - name: Estado | Publica o estado de hoje
        if: always() && steps.baixar.outcome == 'success'
        run: python coletor/nuvem.py subir --data "$DATA"

      - name: Histórico | Publica o que o dia produziu
        if: always() && steps.baixar.outcome == 'success'
        run: python coletor/nuvem.py historico --data "$DATA"
